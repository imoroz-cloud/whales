name: Whale Alerts

# Re-saved to nudge GitHub's scheduler after a long gap in scheduled runs.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: whale-alerts
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run whale check
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: node whale-check.mjs

      - name: Persist state
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name "whale-alerts-bot"
            git config user.email "actions@users.noreply.github.com"
            git add state.json
            git commit -m "chore: update whale-alert state [skip ci]"
            git push
          else
            echo "No state changes to commit"
          fi
